[package]
name = "documind"
version = "1.0.0"
description = "Gemini Based OCR and Kokoro Based TTS application"
authors = ["you"]
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.dev.package.scrypt]
opt-level = 3


[profile.release.package."*"]
opt-level = 3


[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.


[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "documind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["chrono", "macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "1.52.3", features = ["full"] }
dirs = "6.0.0"
iota_stronghold = "2.1.0"
crypto = "0.5.1"
zeroize = "1.8.2"
blake3 = "1.8.5"
chrono = { version = "0.4.44", features = ["serde"] }
infer = "0.19.0"
pdf2image = "0.1.3"
uuid = { version = "1.23.1", features = ["v4"] }
base64 = "0.22.1"
reqwest = { version = "0.13.3", features = ["json"] }
tts-rs = { git = "https://github.com/Parth2684/kokoro-rs" }
sha2 = { version = "0.11.0", features = ["zeroize"] }
tauri-plugin-dialog = "2"
image = { version = "0.25.10", features = ["webp"] }
tauri-plugin-fs = "2"
